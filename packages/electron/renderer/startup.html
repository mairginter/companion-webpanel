<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Companion Webpanel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f141a;
      color: #e9edf2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    /* Drag-Handle: obere Leiste (kein nativer Rahmen) */
    .titlebar {
      -webkit-app-region: drag;
      background: #121821;
      padding: 12px 16px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a3344;
    }

    .titlebar-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      flex-shrink: 0;
      object-fit: contain;
    }

    .titlebar-title {
      font-size: 14px;
      font-weight: 600;
      color: #e9edf2;
    }

    /* Sprach-Umschalter in der Titelleiste (wechselt EN ↔ DE, gilt für Startfenster + Tray) */
    .lang-btn {
      -webkit-app-region: no-drag;
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 24px;
      border-radius: 4px;
      border: 1px solid #2a3344;
      background: #1a2030;
      color: #8896aa;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    .lang-btn:hover { color: #4a9eff; border-color: #4a9eff55; opacity: 1; }
    .lang-btn:hover path, .lang-btn:hover circle { stroke: #4a9eff; }

    /* Rechte Titelleisten-Spalte: Version + darunter Hilfe-Download */
    .titlebar-meta {
      margin-left: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .titlebar-version {
      font-size: 11px;
      color: #4a5568;
      font-family: 'JetBrains Mono', monospace;
      -webkit-app-region: no-drag;
    }

    /* Kompakter Text-Button "Hilfe herunterladen" unter der Version */
    .help-download-btn {
      -webkit-app-region: no-drag;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      padding: 0;
      flex: none;
      font-size: 10px;
      font-weight: 500;
      color: #8896aa;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s;
    }
    .help-download-btn:hover { color: #4a9eff; opacity: 1; }
    .help-download-btn:hover path { stroke: #4a9eff; }

    .content {
      flex: 1;
      padding: 20px 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Adress-Block: Port-Zeile, Netzwerk-Adresse, Geräte-Links */
    .addr-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Netzwerk-Adresse (für Tablet / zweiten PC) mit Kopier-Button */
    .lan-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 22px;
    }
    .lan-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #4a9eff;
      user-select: text;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    .lan-url.none { color: #4a5568; font-family: inherit; font-size: 12px; }
    .lan-copy-btn {
      width: 24px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      border: 1px solid #2a3344;
      background: #1a2030;
      cursor: pointer;
    }
    .lan-copy-btn:hover { border-color: #4a9eff55; opacity: 1; }
    .lan-copy-btn:hover path, .lan-copy-btn:hover rect { stroke: #4a9eff; }
    .lan-copied {
      font-size: 10px;
      color: #21d07a;
      visibility: hidden;
    }

    /* Text-Link: öffnet das Panel mit dem Geräte-Links-Dialog */
    .device-links-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      font-weight: 500;
      color: #8896aa;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s;
    }
    .device-links-btn:hover { color: #4a9eff; opacity: 1; }
    .device-links-btn:hover path, .device-links-btn:hover rect { stroke: #4a9eff; }

    /* Port-Zeile */
    .port-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .port-label {
      font-size: 12px;
      color: #8896aa;
      white-space: nowrap;
    }

    .port-url {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #4a9eff;
    }

    .port-input {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      width: 60px;
      background: #1a2030;
      border: 1px solid #2a3344;
      border-radius: 4px;
      color: #e9edf2;
      padding: 3px 6px;
      outline: none;
    }

    .port-input:focus { border-color: #4a9eff; }

    .port-auto-badge {
      font-size: 10px;
      background: #ff8a3d22;
      color: #ff8a3d;
      border: 1px solid #ff8a3d44;
      border-radius: 3px;
      padding: 1px 5px;
    }

    .port-apply {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid #2a3344;
      background: #1a2030;
      color: #4a9eff;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      white-space: nowrap;
    }
    .port-apply:hover { opacity: 0.8; }

    /* Visuelle Trennlinie */
    .separator {
      border: none;
      border-top: 1px solid #1e2535;
      margin: 0;
    }

    /* ── Config-File-Sektion ─────────────────────────────────────────── */

    .config-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .config-section-header {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #4a5568;
    }

    /* Dateiname als Input-Feld mit angehängtem ⋯-Button */
    .preffile-row {
      display: flex;
      align-items: stretch;
    }

    .preffile-name {
      flex: 1;
      min-width: 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #8896aa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: #0d1117;
      border: 1px solid #2a3344;
      border-right: none;
      border-radius: 4px 0 0 4px;
      padding: 5px 8px;
    }

    .preffile-dots-btn {
      width: 28px;
      flex-shrink: 0;
      border: 1px solid #2a3344;
      border-radius: 0 4px 4px 0;
      background: #151c28;
      color: #8896aa;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
      padding: 0;
    }
    .preffile-dots-btn:hover { color: #4a9eff; background: #1a2030; opacity: 1; }

    /* New Config Button */
    .config-new-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 10px;
      background: #1a2030;
      border: 1px solid #2a3344;
      border-radius: 4px;
      color: #8896aa;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
      flex: none;
    }
    .config-new-btn:hover { border-color: #4a9eff55; color: #c8d0dc; opacity: 1; }
    .config-new-btn:hover .config-new-icon path { stroke: #4a9eff; }

    .config-new-text { display: flex; flex-direction: column; gap: 2px; }
    .config-new-label { font-size: 12px; color: #c8d0dc; font-weight: 500; }
    .config-new-desc  { font-size: 10px; color: #4a5568; }

    /* Fehler-Banner */
    .error-banner {
      display: none;
      background: #ff5a5f22;
      border: 1px solid #ff5a5f44;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #ff5a5f;
    }

    /* Host-Status-Liste */
    .hosts {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .host-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .host-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-connecting { background: #ff8a3d; animation: pulse 1.2s ease-in-out infinite; }
    .dot-connected  { background: #21d07a; }
    .dot-stale      { background: #ff8a3d; }
    .dot-error      { background: #ff5a5f; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .host-name { color: #8896aa; }

    .host-status-text {
      margin-left: auto;
      font-size: 11px;
      color: #4a5568;
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.85; }

    /* Overrides für Config-Sektion-Buttons (kein flex:1, kein padding override) */
    .preffile-dots-btn, .config-new-btn { flex: none; padding: revert; }
    /* Kompakte Buttons: die allgemeine button-Regel (flex:1, großes Padding) zurücknehmen */
    .lang-btn { flex: none; padding: 0 8px; font-size: 11px; font-weight: 600; }
    .lan-copy-btn { flex: none; padding: 0; }
    .device-links-btn { flex: none; padding: 0; font-size: 12px; }

    .btn-primary {
      background: #4a9eff;
      color: #0f141a;
    }

    .btn-secondary {
      background: #1a2030;
      color: #8896aa;
      border: 1px solid #2a3344;
    }

    /* Kein-Host-Hinweis */
    .no-hosts {
      font-size: 12px;
      color: #4a5568;
      text-align: center;
      padding: 8px 0;
    }

    /* Config-Missing-Warnung */
    .config-missing-hint {
      font-size: 12px;
      color: #ff8a3d;
      text-align: left;
      padding: 8px 0;
      white-space: pre-line;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <img class="titlebar-icon" src="../assets/icon-256.png" alt="" />
    <span class="titlebar-title">Companion Webpanel</span>
    <!-- Sprach-Umschalter: zeigt die aktive Sprache, Klick wechselt zur nächsten -->
    <button class="lang-btn" id="btnLanguage">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
        <circle cx="6" cy="6" r="4.8" stroke="#8896aa" stroke-width="1.1"/>
        <path d="M1.2 6h9.6M6 1.2c1.6 1.4 1.6 8.2 0 9.6M6 1.2c-1.6 1.4-1.6 8.2 0 9.6" stroke="#8896aa" stroke-width="1.1" stroke-linecap="round"/>
      </svg>
      <span id="btnLanguageLabel">EN</span>
    </button>
    <div class="titlebar-meta">
      <span class="titlebar-version" id="version"></span>
      <!-- Lädt help-me-KI-by_alex.md herunter (Save-Dialog im Main-Prozess) -->
      <button class="help-download-btn" id="btnDownloadHelp">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M5 1v5.5M2.5 4.5L5 7l2.5-2.5M1.5 9h7" stroke="#8896aa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span id="btnDownloadHelpLabel">Download Help</span>
      </button>
    </div>
  </div>

  <div class="content">
    <div class="addr-group">
    <!-- Port-Zeile -->
    <div class="port-row">
      <span class="port-label">…</span>
      <span class="port-url">http://localhost:</span>
      <input
        class="port-input"
        id="portInput"
        type="number"
        min="1024"
        max="65535"
        value="8080"
      />
      <span class="port-auto-badge" id="autoBadge" style="display:none">auto</span>
      <button class="port-apply" id="btnApplyPort">Apply</button>
    </div>

    <!-- Netzwerk-Adresse: unter dieser Adresse erreichen andere Geräte das Panel -->
    <div class="lan-row">
      <span class="port-label" id="lanLabel">Network:</span>
      <span class="lan-url" id="lanUrl">…</span>
      <button class="lan-copy-btn" id="btnCopyLan">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <rect x="4" y="4" width="6.5" height="6.5" rx="1" stroke="#8896aa" stroke-width="1.1"/>
          <path d="M2.5 8H2a.8.8 0 01-.8-.8V2A.8.8 0 012 1.2h5.2A.8.8 0 018 2v.5" stroke="#8896aa" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
      <span class="lan-copied" id="lanCopied">Copied</span>
    </div>

    <!-- Öffnet das Panel-Fenster mit dem Geräte-Links-Dialog (Kiosk-/Lock-Adressen) -->
    <button class="device-links-btn" id="btnDeviceLinks">
      <svg width="14" height="12" viewBox="0 0 14 12" fill="none">
        <rect x="0.8" y="1" width="8.4" height="6.4" rx="1" stroke="#8896aa" stroke-width="1.1"/>
        <path d="M3 10h4" stroke="#8896aa" stroke-width="1.1" stroke-linecap="round"/>
        <rect x="9.8" y="4" width="3.4" height="7" rx="0.8" stroke="#8896aa" stroke-width="1.1" fill="#0f141a"/>
      </svg>
      <span id="btnDeviceLinksLabel">Device links &amp; kiosk…</span>
    </button>
    </div>

    <hr class="separator" />

    <!-- Config-File-Sektion -->
    <div class="config-section">
      <span class="config-section-header" id="configSectionHeader">Config File</span>

      <!-- Dateiname-Feld + Laden-Button -->
      <div class="preffile-row">
        <span class="preffile-name" id="prefFileName">…</span>
        <button class="preffile-dots-btn" id="btnLoadPref">⋯</button>
      </div>

      <!-- Neue leere Konfiguration -->
      <button class="config-new-btn" id="btnNewConfig">
        <svg class="config-new-icon" width="18" height="20" viewBox="0 0 18 20" fill="none">
          <path d="M3 2h8l4 4v12a1 1 0 01-1 1H3a1 1 0 01-1-1V3a1 1 0 011-1z" stroke="#8896aa" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M11 2v4h4" stroke="#8896aa" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M9 9.5v5M6.5 12h5" stroke="#8896aa" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="config-new-text">
          <span class="config-new-label" id="btnNewConfigLabel">New Empty Config</span>
          <span class="config-new-desc"  id="btnNewConfigDesc">Start with empty settings</span>
        </span>
      </button>
    </div>

    <hr class="separator" />

    <!-- Fehler-Banner (nur sichtbar wenn kein Port gefunden) -->
    <div class="error-banner" id="errorBanner"></div>

    <!-- Host-Status -->
    <div class="hosts" id="hosts">
      <div class="no-hosts" id="initialHostMsg">…</div>
    </div>

    <!-- Aktions-Buttons -->
    <div class="actions">
      <button class="btn-secondary" id="btnOpenApp">Open in App</button>
      <button class="btn-secondary" id="btnOpen">Open in Browser</button>
      <button class="btn-secondary" id="btnHide">Hide</button>
      <button class="btn-secondary" id="btnQuit">Quit</button>
    </div>
  </div>

  <script>
    const api = window.cwpApi

    // ─── XSS escape helper ───────────────────────────────────────────────────

    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    }

    // ─── i18n ────────────────────────────────────────────────────────────────

    // Wird beim Start und nach jedem Sprachwechsel aufgerufen
    function applyI18n(s) {
      document.querySelector('.port-label').textContent = s.panelRunsOn
      document.getElementById('errorBanner').textContent = s.noPortAvailable
      document.getElementById('btnApplyPort').textContent = s.apply
      document.getElementById('btnOpenApp').textContent = s.openInApp
      document.getElementById('btnOpen').textContent = s.openInBrowser
      document.getElementById('btnHide').textContent = s.hide
      document.getElementById('btnQuit').textContent = s.quit
      // Platzhalter existiert nur bis zum ersten Status-Update (renderStatus ersetzt ihn)
      const initialMsg = document.getElementById('initialHostMsg')
      if (initialMsg) initialMsg.textContent = s.waitingForConnection
      document.getElementById('configSectionHeader').textContent = s.configFile
      document.getElementById('btnLoadPref').title = s.loadPreferenceFile
      document.getElementById('btnNewConfigLabel').textContent = s.newConfig
      document.getElementById('btnNewConfigDesc').textContent  = s.newConfigDesc
      document.getElementById('btnDownloadHelpLabel').textContent = s.downloadHelp
      document.getElementById('btnDownloadHelp').title = s.downloadHelpDesc
      document.getElementById('lanLabel').textContent = s.network
      document.getElementById('btnCopyLan').title = s.copyAddress
      document.getElementById('lanCopied').textContent = s.copied
      document.getElementById('btnDeviceLinksLabel').textContent = s.deviceLinks
      document.getElementById('btnDeviceLinks').title = s.deviceLinksDesc
      document.getElementById('btnLanguage').title = s.switchLanguage
      document.getElementById('portInput').title = s.portTitle
      window._i18n = s
      // Status-abhängige Texte (keine Hosts, Config fehlt, keine Netzwerk-Adresse) neu zeichnen
      if (window._status) renderStatus(window._status)
    }

    api.getI18nStrings().then(applyI18n)

    // ─── Sprache ─────────────────────────────────────────────────────────────

    // Reihenfolge, in der der Sprach-Button durchschaltet
    const LANGUAGES = ['en', 'de']
    let currentLang = 'en'

    function showLanguage(lang) {
      currentLang = LANGUAGES.includes(lang) ? lang : 'en'
      document.getElementById('btnLanguageLabel').textContent = currentLang.toUpperCase()
      document.documentElement.lang = currentLang
    }

    document.getElementById('btnLanguage').addEventListener('click', async () => {
      const next = LANGUAGES[(LANGUAGES.indexOf(currentLang) + 1) % LANGUAGES.length]
      // Main-Prozess merkt die Wahl (meta.json) und baut das Tray-Menü neu
      showLanguage(await api.setLanguage(next))
      applyI18n(await api.getI18nStrings())
    })

    // ─── Status rendern ──────────────────────────────────────────────────────

    function renderStatus(status) {
      window._status = status
      if (status.language) showLanguage(status.language)

      // Netzwerk-Adresse: erste LAN-Adresse anzeigen, alle weiteren im Tooltip
      const lanEl = document.getElementById('lanUrl')
      const addrs = (status.lanAddresses || []).map((a) => `http://${a}:${status.port}`)
      const hasLan = addrs.length > 0 && status.port !== 0
      lanEl.textContent = hasLan ? addrs[0] : (window._i18n?.noNetwork ?? '—')
      lanEl.title = hasLan ? addrs.join('\n') : ''
      lanEl.classList.toggle('none', !hasLan)
      document.getElementById('btnCopyLan').style.display = hasLan ? '' : 'none'
      window._lanUrl = hasLan ? addrs[0] : null

      // Port
      document.getElementById('portInput').value = status.port
      const autoBadge = document.getElementById('autoBadge')
      autoBadge.style.display = status.portAuto ? 'inline' : 'none'

      // Fehler-Banner (port === 0 = kein Port gefunden)
      const errorBanner = document.getElementById('errorBanner')
      errorBanner.style.display = status.port === 0 ? 'block' : 'none'

      // Config-Missing: Dateiname rot einfärben
      const prefFileEl = document.getElementById('prefFileName')
      if (prefFileEl) prefFileEl.style.color = status.configMissing ? '#ff5a5f' : ''

      // Hosts
      const hostsEl = document.getElementById('hosts')

      if (status.configMissing) {
        const msg = window._i18n?.configMissing ?? '⚠ Config file not found.\nChoose a file (⋯) or create a new one.'
        hostsEl.innerHTML = `<div class="config-missing-hint">${esc(msg)}</div>`
        return
      }

      if (!status.hosts || status.hosts.length === 0) {
        const msg = window._i18n?.noHostsConfigured ?? 'No hosts configured'
        hostsEl.innerHTML = `<div class="no-hosts">${esc(msg)}</div>`
        return
      }

      hostsEl.innerHTML = status.hosts.map(h => `
        <div class="host-row">
          <div class="host-dot dot-${esc(h.status)}"></div>
          <span class="host-name">${esc(h.name || h.id)}</span>
          <span class="host-status-text">${esc(h.status)}</span>
        </div>
      `).join('')
    }

    // ─── Init ────────────────────────────────────────────────────────────────

    api.getVersion().then((v) => {
      document.getElementById('version').textContent = 'v' + v
    })

    api.getStatus().then(renderStatus)

    api.onStatusUpdate(renderStatus)

    // ─── Port-Änderung ───────────────────────────────────────────────────────

    const portInput = document.getElementById('portInput')

    function applyPort() {
      const port = parseInt(portInput.value, 10)
      if (isNaN(port) || port < 1024 || port > 65535) return
      api.changePort(port)
    }

    portInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') applyPort()
    })

    document.getElementById('btnApplyPort').addEventListener('click', applyPort)

    // ─── Preference File ─────────────────────────────────────────────────────

    api.getSettingsPath().then((normalizedPath) => {
      const filename = normalizedPath.replace(/\\/g, '/').split('/').pop() ?? normalizedPath
      const el = document.getElementById('prefFileName')
      el.textContent = filename
      el.title = normalizedPath
    })

    document.getElementById('btnNewConfig').addEventListener('click', async () => {
      await api.newSettingsFile()
      // newSettingsFile löst app.relaunch() aus wenn Datei gewählt — kein weiterer Code nötig
    })

    document.getElementById('btnLoadPref').addEventListener('click', async () => {
      const chosen = await api.chooseSettingsPath()
      if (!chosen) return
      await api.applySettingsPath(chosen)
      // applySettingsPath löst app.relaunch() aus — kein weiterer Code nötig
    })

    // ─── Buttons ─────────────────────────────────────────────────────────────

    document.getElementById('btnOpenApp').addEventListener('click', () => api.openPanelApp())
    document.getElementById('btnOpen').addEventListener('click', () => api.openPanel())
    document.getElementById('btnHide').addEventListener('click', () => api.hideWindow())
    document.getElementById('btnQuit').addEventListener('click', () => api.quit())
    document.getElementById('btnDownloadHelp').addEventListener('click', () => api.downloadHelp())
    document.getElementById('btnDeviceLinks').addEventListener('click', () => api.openDeviceLinks())

    // Netzwerk-Adresse kopieren + kurze Bestätigung einblenden
    document.getElementById('btnCopyLan').addEventListener('click', async () => {
      if (!window._lanUrl) return
      await api.copyText(window._lanUrl)
      const hint = document.getElementById('lanCopied')
      hint.style.visibility = 'visible'
      setTimeout(() => { hint.style.visibility = 'hidden' }, 1500)
    })
  </script>
</body>
</html>
