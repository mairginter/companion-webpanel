appId: com.companionwebpanel.app
productName: CompanionWebpanel
copyright: "Copyright © 2026"

# ASAR-Archivierung: alle App-Dateien in einem komprimierten Bundle.
# Beschleunigt File-I/O beim Startup und reduziert Distribution-Größe.
asar: true

# Maximale Kompression (langsamerer Build, deutlich kleinere .exe).
compression: maximum

# Überflüssige Metadaten aus package.json im Bundle entfernen
removePackageScripts: true
removePackageKeywords: true

# electron-builder verwendet packages/electron als App-Root
# (wo package.json mit main: "dist/main.js" liegt)
directories:
  app: packages/electron
  output: release
  buildResources: packages/electron/assets

# Dateien die in das Package kommen (relativ zu packages/electron/)
# build.mjs kopiert frontend/dist → packages/electron/frontend/ vor dem Packaging
files:
  - dist/**          # kompilierter Electron-Code (main.js, preload.js)
  - renderer/**      # startup.html
  - frontend/**      # Frontend PWA (von build.mjs kopiert)
  - assets/tray-*.png  # Tray-Icons (connected/error/partial)
  - assets/icon-256.png  # App-Icon im Startup-Fenster
  - "!**/*.map"      # Source-Maps nie mitliefern
  - "!**/*.ts"       # TypeScript-Quellen nicht ins Bundle
  - "!**/tsconfig*.json"

# Windows
win:
  target:
    - target: portable
      arch: [x64]
  icon: packages/electron/assets/icon.ico

portable:
  artifactName: "CompanionWebpanel-${version}.exe"

# macOS
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: packages/electron/assets/icon.icns
  category: public.app-category.utilities

dmg:
  title: "Companion Webpanel ${version}"
